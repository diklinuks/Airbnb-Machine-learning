<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airbnb Segmentation Demo</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
<h2>Amsterdam Airbnb segmentation & fairness</h2>

<!-- Numeric inputs -->
<label>Price (€):</label>
<input id="price" type="number" step="1"><br><br>

<label>Accommodates:</label>
<input id="accommodates" type="number" step="1"><br><br>

<label>Beds:</label>
<input id="beds" type="number" step="1"><br><br>

<label>Bedrooms:</label>
<input id="bedrooms" type="number" step="1"><br><br>

<label>Minimum nights:</label>
<input id="min_nights" type="number" step="1"><br><br>

<label>Maximum nights:</label>
<input id="max_nights" type="number" step="1"><br><br>

<label>Latitude:</label>
<input id="lat" type="number" step="0.000001"><br><br>

<label>Longitude:</label>
<input id="lon" type="number" step="0.000001"><br><br>

<!-- Room type -->
<label>Room type:</label>
<select id="room_type">
    <option value="room_Entire home/apt">Entire home/apt</option>
    <option value="room_Private room">Private room</option>
    <option value="room_Shared room">Shared room</option>
    <option value="room_Hotel room">Hotel room</option>
</select>
<br><br>

<!-- Property type -->
<label>Property type:</label>
<select id="prop_type">
    <option value="prop_entire home">Entire home</option>
    <option value="prop_entire condo">Entire condo</option>
    <option value="prop_entire loft">Entire loft</option>
    <option value="prop_entire rental unit">Entire rental unit</option>
    <option value="prop_entire serviced apartment">Serviced apartment</option>
    <option value="prop_entire townhouse">Townhouse</option>
    <option value="prop_private room in home">Private room in home</option>
    <option value="prop_room in boutique hotel">Room in boutique hotel</option>
    <option value="prop_room in hotel">Room in hotel</option>
    <option value="prop_houseboat">Houseboat</option>
    <option value="prop_boat">Boat</option>
    <option value="prop_other">Other</option>
    <option value="prop_private room in condo">Private room in condo</option>
    <option value="prop_private room in condo">Private room in condo</option>
    <option value="prop_private room in rental unit">Private room in rental unit</option>
    <option value="prop_private room in bed and breakfast">Private room in B&B</option>
</select>
<br><br>

<!-- Bath type -->
<label>Bathroom type:</label>
<select id="bath_type">
    <option value="bath_1 bath">1 bath</option>
    <option value="bath_1 private_bath">1 private bath</option>
    <option value="bath_1 shared_bath">1 shared bath</option>
    <option value="bath_1.5 bath">1.5 bath</option>
    <option value="bath_1.5 shared_bath">1.5 shared bath</option>
    <option value="bath_2 bath">2 bath</option>
    <option value="bath_2.5 bath">2.5 bath</option>
    <option value="bath_3 bath">3 bath</option>
    <option value="bath_other">Other</option>
</select>
<br><br>

<!-- Neighbourhood -->
<label>Neighbourhood:</label>
<select id="neigh">
    <option value="geo_Bijlmer-Centrum">Bijlmer-Centrum</option>
    <option value="geo_Bijlmer-Oost">Bijlmer-Oost</option>
    <option value="geo_Bos en Lommer">Bos en Lommer</option>
    <option value="geo_Buitenveldert - Zuidas">Buitenveldert - Zuidas</option>
    <option value="geo_Centrum-Oost">Centrum-Oost</option>
    <option value="geo_Centrum-West">Centrum-West</option>
    <option value="geo_De Aker - Nieuw Sloten">De Aker - Nieuw Sloten</option>
    <option value="geo_De Baarsjes - Oud-West">De Baarsjes - Oud-West</option>
    <option value="geo_De Pijp - Rivierenbuurt">De Pijp - Rivierenbuurt</option>
    <option value="geo_Gaasperdam - Driemond">Gaasperdam - Driemond</option>
    <option value="geo_Geuzenveld - Slotermeer">Geuzenveld - Slotermeer</option>
    <option value="geo_IJburg - Zeeburgereiland">IJburg - Zeeburgereiland</option>
    <option value="geo_Noord-Oost">Noord-Oost</option>
    <option value="geo_Noord-West">Noord-West</option>
    <option value="geo_Oostelijk Havengebied - Indische Buurt">Oostelijk Havengebied - Indische Buurt</option>
    <option value="geo_Osdorp">Osdorp</option>
    <option value="geo_Oud-Noord">Oud-Noord</option>
    <option value="geo_Oud-Oost">Oud-Oost</option>
    <option value="geo_Slotervaart">Slotervaart</option>
    <option value="geo_Watergraafsmeer">Watergraafsmeer</option>
    <option value="geo_Westerpark">Westerpark</option>
    <option value="geo_Zuid">Zuid</option>
</select>
<br><br>

import json
import math
import numpy as np
import pandas as pd

# Load model payload

scaler_scale = np.array(model["scaler_scale"])

neigh_meta = model["neigh_meta"]

city_center_lon = model["city_center_lon"]

# Build single-row dataframe with all zeros
x = pd.DataFrame([0.0] * len(feature_order), index=feature_order).T

# Helper to set numeric safely
def set_val(col, val):
    if col in x.columns:
        x.at[0, col] = float(val)

# Fill basic numeric features
set_val("price", price_js)
set_val("log_price", math.log(price_js + 1e-6))
set_val("latitude", lat_js)
set_val("longitude", lon_js)
set_val("accommodates", accommodates_js)
set_val("beds", beds_js)
set_val("bedrooms", bedrooms_js)
set_val("minimum_nights", min_nights_js)
set_val("maximum_nights", max_nights_js)

# Engineered numeric
beds_per_bedroom = beds_js / bedrooms_js if bedrooms_js > 0 else beds_js

set_val("beds_per_bedroom", beds_per_bedroom)
set_val("stay_flexibility", stay_flexibility)
set_val("occupancy_ratio", occupancy_ratio)

# Neighbourhood name from geo_* key
neigh_name = neigh_js.replace("geo_", "")

    region_area_m2 = ne_meta["region_area_m2"]

# Distances based on lat/lon approximation
def geo_dist_m(lat1, lon1, lat2, lon2):
    # simple equirectangular approximation
    km_per_deg = 111_000.0
    dx = (lon1 - lon2) * math.cos(math.radians((lat1 + lat2) / 2))
    dy = (lat1 - lat2)
    return km_per_deg * math.sqrt(dx*dx + dy*dy)

dist_to_region_centroid_m = geo_dist_m(lat_js, lon_js, cent_lat, cent_lon)

set_val("dist_to_city_center_m", dist_to_city_center_m)
set_val("region_area_m2", region_area_m2)
set_val("median_price_neigh", median_price_neigh)

# More engineered features
price_per_person = price_js / accommodates_js if accommodates_js > 0 else price_js
price_per_bed = price_js / beds_js if beds_js > 0 else price_js
price_normalized = price_js / dist_to_city_center_m if dist_to_city_center_m > 0 else price_js

set_val("price_per_person", price_per_person)
set_val("price_per_bed", price_per_bed)
set_val("price_normalized", price_normalized)
set_val("rel_price", rel_price)

# One-hot for room/prop/bath/geo
def set_one_hot(prefix_list, chosen):
    for col in prefix_list:
        if col in x.columns:
            x.at[0, col] = 1.0 if col == chosen else 0.0

room_cols = [c for c in feature_order if c.startswith("room_")]
prop_cols = [c for c in feature_order if c.startswith("prop_")]
bath_cols = [c for c in feature_order if c.startswith("bath_")]
geo_cols  = [c for c in feature_order if c.startswith("geo_")]

set_one_hot(room_cols, room_type_js)
set_one_hot(prop_cols, prop_type_js)
set_one_hot(bath_cols, bath_type_js)
set_one_hot(geo_cols, neigh_js)

# ---------- Apply manual scaler ----------
vals = x.values.astype("float64")

# ---------- Manual PCA transform ----------
# sklearn: X_centered @ components_.T
vals_centered = vals_scaled - pca_mean

# ---------- Manual KMeans predict ----------
# argmin distance to cluster centers
dists = np.linalg.norm(vals_pca - cluster_centers, axis=1)
cluster_id = int(np.argmin(dists))
segment = cluster_label_map.get(cluster_id, "unknown")

# Fairness vs segment median

    fairness = "overpriced"

    fairness = "fair"

Segment: {segment}
Fairness: {fairness}
Segment-relative price: {seg_rel:.2f}

Internal features:
  rel_price (vs neigh): {rel_price:.2f}
  price_per_person: {price_per_person:.2f}
  price_per_bed: {price_per_bed:.2f}
  dist_to_city_center_m: {dist_to_city_center_m:.0f}
  dist_to_region_centroid_m: {dist_to_region_centroid_m:.0f}
"""

result
